<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1a110c" />
  <title>อโยธยา Idle</title>
  <link rel="icon" type="image/png" href="./favicon.png" />
  <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="อโยธยา" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;600;700&family=Charm:wght@700&family=Itim&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="hud">
      <button id="btn-menu" class="rbtn" aria-label="เมนู"><span class="burger"><i></i><i></i><i></i></span></button>
      <div class="when">
        <div class="era"><span id="hud-life"></span><b id="hud-year"></b></div>
        <div id="hud-date" class="date"></div>
      </div>
      <button id="btn-status" class="status-chip" aria-label="สถานะเวลา"></button>
    </header>
    <div class="res">
      <button class="pill" data-tip="money"><span id="ic-money"></span><b id="res-money"></b></button>
      <button class="pill" data-tip="merit"><span id="ic-merit"></span><b id="res-merit"></b></button>
      <button class="pill" data-tip="aff"><span id="ic-aff"></span><b id="res-aff"></b></button>
    </div>
    <div class="stage">
      <canvas id="scene" aria-label="ฉากตัวละคร แตะเพื่อคุยหรือเก็บของ"></canvas>
      <div id="plaque" class="plaque"></div>
      <button id="reign" class="reign" data-act="reign"></button>
      <div id="floats" class="floats"></div><div id="speech" class="speech"></div><div id="banner" class="banner"></div>
      <div class="daytrack"><i id="daybar"></i></div>
    </div>
    <div class="lifebar">
      <button id="hpbox" class="hp" data-tip="health"><span id="ic-hp"></span><span class="hpbar"><i id="hpfill"></i></span></button>
      <button id="joybox" class="hp joy" data-tip="joy"><span id="ic-joy"></span><span class="hpbar"><i id="joyfill"></i></span></button>
      <span id="lifeage" class="age"></span>
      <div class="lifetrack"><div class="groove"><i id="lifefill"></i></div><div id="lifemarks"></div><span id="lifeme" class="me"></span></div>
      <span id="lifeend" class="age end"></span>
    </div>
    <main id="panel" class="panel"></main>
    <nav id="tabs" class="tabs">
      <button data-tab="life"><span data-ic="person"></span><small>ชีวิต</small></button>
      <button data-tab="shop"><span data-ic="stall"></span><small>ตลาด</small></button>
      <button data-tab="char"><span data-ic="bars"></span><small>ค่าพลัง</small></button>
      <button data-tab="log"><span data-ic="scroll"></span><small>บันทึก</small></button>
    </nav>
  </div>
  <div id="menu" class="menu"><div id="menu-body" class="menu-panel"></div></div>
  <div id="modal" class="modal"><div id="modal-body" class="sheet"></div></div>
  <div id="toast" class="toast"></div>
  <script type="module" src="/src/game/main.ts"></script>
</body>
</html>
